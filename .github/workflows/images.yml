name: images
# Dựng ảnh api (CHỈ lõi — gói ngoài lõi ghép trên VPS bằng deploy/api-packs.Dockerfile) + web cho MỖI commit trên main, đẩy lên GHCR công khai;
# VPS chỉ kéo (deploy/ops/deploy.py ``_fetch``) — sự cố 23/11/2026: dựng trên VPS dùng chung làm Swarm khởi động lại mọi dịch vụ.
# KHÔNG secret nào ngoài GITHUB_TOKEN sẵn có (quyền ghi gói của chính repo này), KHÔNG phát hành: phát hành vẫn chỉ từ deploy/release.sh.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: { contents: read, packages: write }
# mỗi commit một nhóm, không huỷ lượt đang chạy: commit nào cũng có ảnh (release.sh có thể đang phát hành đúng commit đó)
concurrency: { group: "images-${{ github.sha }}", cancel-in-progress: false }
jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      matrix: { service: [api, web] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: BARISTA_RELEASE=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/barista-${{ matrix.service }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # lớp apt / phụ thuộc giữ qua bộ nhớ đệm của Actions ⇒ commit sau dựng nhanh, VPS chỉ kéo lớp đổi
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
