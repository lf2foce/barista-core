name: release
# push main ⇒ chạy test (backend trên Postgres thật + web) ⇒ gửi `git archive` của đúng commit qua khoá SSH bị giới hạn. VPS dựng ảnh,
# migration từ ảnh mới, đổi bản start-first, kiểm đúng commit, lỗi thì quay lui (deploy/ops/deploy.py — runbook 11).
# 01/11/2026: tài khoản GitHub quá hạn mức ⇒ CHỈ chạy tay (khỏi mỗi lần push sinh một lượt lỗi). Phát hành thường ngày: deploy/release.sh từ
# Mac. Sửa thanh toán xong muốn push = tự phát hành: thêm lại `push: { branches: [main] }`.
on:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: ./scripts/dev-db.sh
      - run: uv run ruff check src tests ../deploy
      - run: uv run pyright
      - run: uv run pytest -q
  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
  deploy:
    needs: [backend, web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency: { group: barista-deploy, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - name: Gửi mã đúng commit + lệnh phát hành qua khoá SSH chỉ nhận "deploy <sha> <lượt>"
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then echo "Chưa đặt secret VPS_SSH_KEY — bỏ qua phát hành"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar.gz "$GITHUB_SHA" | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$VPS_HOST" "deploy $GITHUB_SHA $GITHUB_RUN_NUMBER"
