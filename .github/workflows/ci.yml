name: ci
# Kiểm mọi PR và mỗi lần đẩy main (repo công khai — Actions miễn phí): backend trên Postgres thật + web. KHÔNG dùng secret nào, KHÔNG phát hành.
# Phát hành chỉ từ máy của người được giao (deploy/release.sh, runbook 11) — khoá SSH tới máy chủ không bao giờ nằm trong repo công khai (rà 21/11/2026).
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: ./scripts/dev-db.sh
      - run: uv run ruff check src tests ../deploy
      - run: uv run pyright
      - run: uv run pytest -q
  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }   # bản pnpm từ "packageManager" của web (bước uses không theo working-directory)
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
